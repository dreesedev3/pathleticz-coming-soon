<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathleticz — Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --light-blue: #349DFF;
            --dark-blue: #1D3557;
            --bg-dark: #0A0E17;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
        }

        body {
            background: var(--bg-dark);
            font-family: 'Barlow', sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 2.5rem 1.25rem 3rem;
        }

        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 35% at 50% 15%, rgba(52, 157, 255, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 80% 50% at 20% 90%, rgba(29, 53, 87, 0.3) 0%, transparent 60%),
                linear-gradient(180deg, #101824 0%, #0D1B2A 40%, #0A0E17 100%);
        }

        .streak {
            position: fixed;
            height: 2px;
            z-index: 0;
            opacity: 0;
            animation: streak-move 10s linear infinite;
        }

        .streak:nth-child(2) { top: 22%; width: 300px; background: linear-gradient(90deg, transparent, rgba(52, 157, 255, 0.08), transparent); animation-delay: 0s; }
        .streak:nth-child(3) { top: 68%; width: 380px; background: linear-gradient(90deg, transparent, rgba(29, 53, 87, 0.15), transparent); animation-delay: 4s; }

        @keyframes streak-move {
            0% { left: -500px; opacity: 0; transform: rotate(-3deg); }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 110%; opacity: 0; transform: rotate(-3deg); }
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-wrapper {
            width: 100%;
            max-width: 300px;
            margin-bottom: 0.5rem;
            animation: logo-in 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes logo-in {
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(52, 157, 255, 0.3));
        }

        .tagline {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 2rem;
            max-width: 300px;
            line-height: 1.4;
        }

        .link-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            width: 100%;
            padding: 0.95rem 1.25rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.01em;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }

        .link-btn:active {
            transform: scale(0.98);
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(52, 157, 255, 0.4);
        }

        .link-btn.primary {
            background: linear-gradient(135deg, var(--light-blue), var(--dark-blue));
            border: none;
            padding: 1.1rem 1.25rem;
            font-size: 1.15rem;
            box-shadow: 0 0 30px rgba(52, 157, 255, 0.25);
        }

        .link-btn.primary:hover {
            box-shadow: 0 0 40px rgba(52, 157, 255, 0.4);
        }

        .link-btn.featured {
            background: rgba(52, 157, 255, 0.08);
            border: 1px solid rgba(52, 157, 255, 0.35);
        }

        .link-btn.featured:hover {
            background: rgba(52, 157, 255, 0.14);
            border-color: rgba(52, 157, 255, 0.55);
        }

        .link-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            fill: currentColor;
        }

        .link-btn.primary svg {
            width: 20px;
            height: 20px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 1.5rem 0 1.25rem;
        }

        .section-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.9rem;
            align-self: flex-start;
        }

        footer {
            position: relative;
            z-index: 1;
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        @media (prefers-reduced-motion: reduce) {
            .streak, .logo-wrapper { animation: none; opacity: 1; transform: none; }
        }
    </style>
</head>
